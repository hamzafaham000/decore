services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decore
      POSTGRES_PASSWORD: decore
      POSTGRES_DB: decore
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decore -d decore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
